[project]
name = "finsight"
version = "0.1.0"
description = "Grounded RAG over SEC 10-K filings with hybrid retrieval, reranking, model fallback, citation verification, and HITL."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "html5lib>=1.1",
    "httpx>=0.27",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis>=0.0.30",
    "lxml>=6.1.1",
    "openai>=3.0.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.21",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ragas>=0.3.1",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.30",
    "yfinance>=1.6.0",
]

[project.optional-dependencies]
langfuse = [
    "langfuse>=3.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", "data", "docs", "PRD.md", "FinSight-prd.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["^tests/"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/*/__main__.py",
]

[tool.coverage.report]
omit = [
    "src/*/__main__.py",
]
