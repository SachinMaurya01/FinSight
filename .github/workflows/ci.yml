name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests mock external providers; these values only satisfy settings validation.
  ENVIRONMENT: development
  POSTGRES_DATABASE_URL: postgresql://rag_user:rag_password@localhost:5432/rag_db
  REDIS_URL: redis://localhost:6379/0
  CHECKPOINTER_TYPE: in_memory
  SEC_EDGAR_USER_AGENT: FinSight CI ci@example.com

jobs:
  lint-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy src
      - name: Test with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  eval-gate:
    if: github.event_name != 'schedule'
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: uv sync --frozen
      - name: Retrieval smoke eval (offline)
        run: uv run python -m src.eval --ablation --limit 10 --output /tmp/eval_smoke.json
      - name: Regression gate
        run: >-
          uv run python -m src.eval.gate
          --baseline data/eval/smoke_baseline.json
          --new /tmp/eval_smoke.json
          --section hybrid_rerank

  full-eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: uv sync --frozen
      - name: Embed and seed pgvector
        run: uv run python -m src.retrieval seed
      - name: Full answer eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VLLM_BASE_URL: ${{ secrets.VLLM_BASE_URL }}
          VLLM_MODEL: ${{ secrets.VLLM_MODEL }}
        run: uv run python -m src.eval --metrics heuristic --output /tmp/eval_full.json
      - name: Regression gate
        run: >-
          uv run python -m src.eval.gate
          --baseline data/eval/baseline.json
          --new /tmp/eval_full.json
