<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">FinSight CLI demo</title>
  <desc id="desc">Terminal-style rendering of the offline retrieval ablation and a sample grounded answer from the checked-in sample data.</desc>

  <defs>
    <style>
      .term { font: 14px "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; font-weight: 700; }
      .muted { fill: #94a3b8; }
      .ok { fill: #86efac; }
      .head { fill: #fbbf24; font-weight: 700; }
      .title { font: 700 18px Inter, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .caption { font: 12px Inter, Helvetica, Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1040" height="620" fill="#f8fafc"/>
  <text x="40" y="40" class="title">FinSight — CLI demo</text>
  <text x="40" y="62" class="caption">Rendered from the checked-in sample data. No hosted UI is claimed; this is the actual CLI shape.</text>

  <rect x="32" y="82" width="976" height="500" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="56" cy="108" r="6" fill="#f87171"/>
  <circle cx="78" cy="108" r="6" fill="#fbbf24"/>
  <circle cx="100" cy="108" r="6" fill="#34d399"/>
  <text x="900" y="112" class="term muted">zsh</text>

  <g class="term">
    <text x="56" y="150"><tspan class="prompt">$</tspan> uv run python -m src.eval --ablation</text>
    <text x="56" y="182" class="head">| Configuration                  | Context precision | Context recall | MRR    |</text>
    <text x="56" y="204">| Dense only                     | 0.7321            | 1.0000         | 0.8929 |</text>
    <text x="56" y="226">| Hybrid (dense + BM25, RRF)     | 0.7366            | 1.0000         | 0.9196 |</text>
    <text x="56" y="248">| Hybrid + cross-encoder rerank  | 0.7589            | 1.0000         | 0.9464 |</text>
    <text x="56" y="270" class="muted">Scored 28/30 questions (tool-only questions have no citation labels), k=8, chunks=247.</text>

    <text x="56" y="314"><tspan class="prompt">$</tspan> uv run python -m src.graph ask "What were Apple's total net sales in fiscal 2023?" --k 5</text>
    <text x="56" y="342" class="muted">tier=simple provider=groq</text>
    <text x="56" y="364" class="ok">verification passed=True failed=0</text>
    <text x="56" y="392" class="head">=== ANSWER ===</text>
    <text x="56" y="416">Apple's total net sales in fiscal 2023 were $383.3 billion [1].</text>
    <text x="56" y="444" class="head">=== SOURCES ===</text>
    <text x="56" y="468">  aapl 10-K FY2023 | Item 7 MD&amp;A</text>
  </g>

  <text x="40" y="604" class="caption">The answer above is the checked-in baseline output; retrieval numbers are generated by `make ablation`.</text>
</svg>
